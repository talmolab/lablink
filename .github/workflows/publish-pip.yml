name: Publish Python Packages

on:
  release:
    types: [published]
  push:
    tags:
      - lablink-allocator-service_v*
      - lablink-client-service_v*
      - lablink-cli_v*
  workflow_dispatch:
    inputs:
      package:
        type: choice
        options: [lablink-allocator-service, lablink-client-service, lablink-cli]
        required: true
        description: Which package to publish
      dry_run:
        type: boolean
        default: true
        description: Build only (no publish)
      skip_tests:
        type: boolean
        default: false
        description: Skip test suite (not recommended)

permissions:
  contents: read
  id-token: write

# A GitHub Release fires both a tag-push run and a release run for the same
# version. Serialize them (ref_name is the tag for both) so the loser's
# already-on-PyPI check sees the winner's upload and skips instead of dying
# with 400 "File already exists".
concurrency:
  group: publish-pip-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: lablink-allocator-service
            module: lablink_allocator_service
            dir: packages/allocator
            tag_prefix: lablink-allocator-service_v
            path_filter: packages/allocator
          - package: lablink-client-service
            module: lablink_client_service
            dir: packages/client
            tag_prefix: lablink-client-service_v
            path_filter: packages/client
          - package: lablink-cli
            module: lablink_cli
            dir: packages/cli
            tag_prefix: lablink-cli_v
            path_filter: packages/cli

    steps:
      # Check if this matrix job should run
      - name: Check if package matches trigger
        id: should_run
        run: |
          SHOULD_RUN=false

          if [ "${{ github.event_name }}" = "release" ]; then
            if [[ "${{ github.event.release.tag_name }}" == ${{ matrix.tag_prefix }}* ]]; then
              SHOULD_RUN=true
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [[ "$GITHUB_REF_NAME" == ${{ matrix.tag_prefix }}* ]]; then
              SHOULD_RUN=true
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.package }}" = "${{ matrix.package }}" ]; then
              SHOULD_RUN=true
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          echo "Package ${{ matrix.package }}: should_run=$SHOULD_RUN"

      - name: Checkout repository
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup UV
        if: steps.should_run.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.11'

      # GUARDRAIL 1: Branch verification
      - name: Verify release from main branch
        if: steps.should_run.outputs.should_run == 'true' && github.event_name == 'release'
        run: |
          if [ "${{ github.event.release.target_commitish }}" != "main" ]; then
            echo "❌ Releases must be created from main branch"
            echo "Current branch: ${{ github.event.release.target_commitish }}"
            exit 1
          fi
          echo "✅ Release from main branch"

      # GUARDRAIL 2: Version verification
      - name: Verify version matches tag
        if: steps.should_run.outputs.should_run == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
          else
            TAG_VERSION="${GITHUB_REF_NAME}"
          fi
          TAG_VERSION="${TAG_VERSION#${{ matrix.tag_prefix }}}"

          TOML_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)

          echo "Tag version: $TAG_VERSION"
          echo "pyproject.toml version: $TOML_VERSION"

          if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Please update version in pyproject.toml to $TAG_VERSION"
            exit 1
          fi
          echo "✅ Versions match: $TOML_VERSION"
        working-directory: ${{ matrix.dir }}

      # GUARDRAIL 3: Package metadata check
      - name: Verify package metadata
        if: steps.should_run.outputs.should_run == 'true'
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)

          project = data.get('project', {})
          required = ['name', 'version', 'description', 'authors']
          missing = [k for k in required if k not in project]

          if missing:
              print(f'❌ Missing required metadata: {missing}')
              exit(1)

          # Verify package name matches expected
          if project['name'] != '${{ matrix.package }}':
              print(f\"❌ Package name mismatch: {project['name']} != ${{ matrix.package }}\")
              exit(1)

          print('✅ Package metadata complete:')
          print(f\"  Name: {project['name']}\")
          print(f\"  Version: {project['version']}\")
          print(f\"  Description: {project['description']}\")
          "
        working-directory: ${{ matrix.dir }}

      # Install dependencies
      - name: Install dependencies
        if: steps.should_run.outputs.should_run == 'true'
        run: |
          uv sync --extra dev
        working-directory: ${{ matrix.dir }}

      # GUARDRAIL 4: Linting
      - name: Run linting
        if: steps.should_run.outputs.should_run == 'true'
        run: |
          echo "Running ruff check..."
          uv run ruff check src tests
          echo "✅ Linting passed"
        working-directory: ${{ matrix.dir }}

      # GUARDRAIL 5: Test suite
      - name: Run tests
        if: steps.should_run.outputs.should_run == 'true' && inputs.skip_tests != 'true'
        run: |
          echo "Running test suite..."
          uv run pytest tests \
            --ignore=tests/terraform \
            --cov=src/${{ matrix.module }} \
            --cov-report=term-missing \
            --cov-fail-under=0
          echo "✅ Tests passed"
        working-directory: ${{ matrix.dir }}

      # GUARDRAIL 6: Build verification
      - name: Build package
        if: steps.should_run.outputs.should_run == 'true'
        run: |
          echo "Building package..."
          uv build --package ${{ matrix.package }}
          echo "✅ Package built successfully"
          echo ""
          echo "Build artifacts:"
          ls -lh dist/

      # Makes re-runs idempotent. PyPI forbids file-name reuse, so a second
      # run over an already-published version dies in `uv publish` with
      # 400 "File already exists" — hit by re-running a flaky publish, or by
      # creating the GitHub Release after the tag push already published.
      #
      # Deliberately not `uv publish --check-url`: that compares local and
      # remote hashes, and `uv build` is not byte-reproducible (two builds of
      # identical source differ), so on a re-run it fails with "Local file and
      # index file do not match" — the same failure wearing a scarier name.
      # Asking PyPI whether the version exists sidesteps the hashes entirely.
      - name: Check whether this version is already on PyPI
        id: already_published
        if: |
          steps.should_run.outputs.should_run == 'true' &&
          (github.event_name != 'workflow_dispatch' ||
           inputs.dry_run == false)
        run: |
          VERSION=$(grep '^version = ' ${{ matrix.dir }}/pyproject.toml | cut -d'"' -f2)
          URL="https://pypi.org/pypi/${{ matrix.package }}/${VERSION}/json"
          if curl -sfL --max-time 30 -o /dev/null "$URL"; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "⏭️  ${{ matrix.package }} ${VERSION} is already on PyPI — skipping upload."
            echo "    Versions are immutable there; publish a new version to ship changes."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "${{ matrix.package }} ${VERSION} is not on PyPI yet."
          fi

      # PUBLISH (unless dry run)
      - name: Publish to PyPI
        id: publish
        if: |
          steps.should_run.outputs.should_run == 'true' &&
          steps.already_published.outputs.published != 'true' &&
          (github.event_name != 'workflow_dispatch' ||
           inputs.dry_run == false)
        run: |
          echo "Publishing ${{ matrix.package }} to PyPI..."
          uv publish dist/*
          echo "✅ Published successfully!"
          echo ""
          echo "📦 Package published to PyPI"

          # Extract version for reference
          VERSION=$(grep '^version = ' ${{ matrix.dir }}/pyproject.toml | cut -d'"' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"
          echo ""
          echo "ℹ️  To build production Docker images with all package versions:"
          echo "   gh workflow run lablink-images.yml -f environment=prod \\"
          echo "     -f allocator_version=<allocator-version> \\"
          echo "     -f client_version=<client-version>"

      # Dry run summary
      - name: Dry run summary
        if: steps.should_run.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 DRY RUN COMPLETE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ All guardrails passed:"
          echo "  • Package metadata verified"
          echo "  • Linting passed"
          echo "  • Tests passed"
          echo "  • Package built successfully"
          echo ""
          echo "Package was NOT published (dry_run=true)"
          echo ""
          echo "To publish, run workflow again with:"
          echo "  package: ${{ matrix.package }}"
          echo "  dry_run: false"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# nginx config baked into the allocator container.
# Listens on :5000 (the container's public port; nginx is the listener now
# instead of Flask). Routes:
#   /                     → Flask control plane (form, dashboards, etc.)
#   /api/*, /admin/, etc. → Flask
#   /desktop              → Flask (renders the noVNC viewer)
#   /static/novnc/*       → static files served by nginx directly,
#                           aliased to /usr/share/novnc/ (apt-installed)
#   /proxy/<token>        → WebSocket; auth_request to Flask first,
#                           then proxy to the upstream KasmVNC
#   /internal/proxy_auth  → internal; only reachable from auth_request
#   /tun-<prefix>[/...]   → WebSocket; auth_request to Flask first,
#                           then proxy to the loopback-bound tunnel server.
#                           Prefix must be the URL's first path segment
#                           (see the location block for why).
#   /internal/tunnel_auth → internal; only reachable from auth_request

upstream flask {
    server 127.0.0.1:8000;
}

server {
    listen 5000;
    server_name _;

    # Control plane: everything not otherwise matched goes to Flask.
    # proxy_*_timeout bumped from nginx's 60s default because /destroy
    # and /api/launch run terraform synchronously and routinely exceed
    # 60s; the ALB above us has a much higher ceiling.
    location / {
        proxy_pass http://flask;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # noVNC bundle — KasmVNC's, NOT Debian's generic novnc package.
    # Debian's novnc sends RFB extension types (msg 97) that KasmVNC
    # rejects on the first mouse/keyboard event; the Kasm-bundled
    # viewer is the only one protocol-compatible with kasmvncserver.
    location /static/novnc/ {
        alias /usr/share/kasmvnc/www/;
        access_log off;
    }

    # WebSocket proxy to the assigned client's KasmVNC, gated by auth_request.
    # nginx pauses the upgrade and asks Flask whether the request is authorized
    # AND which upstream to forward to (X-Upstream) AND which HTTP Basic Auth
    # header value to attach (X-Auth-Basic). On 200, nginx opens the upstream
    # and pipes bytes. On 401, the WebSocket is rejected.
    #
    # The upstream URI is /websockify (noVNC convention) — KasmVNC serves the
    # WebSocket there. /proxy/<token> is purely a public-side naming scheme
    # so we can keep the per-session token in the URL for auth_request. Since
    # proxy_pass uses a variable, nginx does NOT rewrite the URI automatically;
    # we set it explicitly to /websockify.
    location ~ ^/proxy/(?<token>[A-Za-z0-9_-]+)$ {
        auth_request           /internal/proxy_auth;
        auth_request_set       $upstream    $upstream_http_x_upstream;
        auth_request_set       $auth_basic  $upstream_http_x_auth_basic;

        # $upstream is a literal IP for AWS/lan_direct (no resolution
        # needed), but a Tailscale MagicDNS hostname for mesh_overlay
        # (<overlay_hostname>.<tailnet>.ts.net). nginx does NOT consult
        # the OS resolver or /etc/hosts for a variable-based proxy_pass
        # — without an explicit resolver directive it fails outright
        # with "no resolver defined to resolve ...", regardless of
        # whether the Tailscale connection itself is healthy.
        # 100.100.100.100 is Tailscale's well-known internal MagicDNS
        # stub, reachable from any tailnet-joined device (harmless/
        # unused for AWS/lan_direct, which never resolves a hostname
        # here). ipv6=off matches this deployment's IPv4-only upstreams.
        resolver                100.100.100.100 ipv6=off valid=30s;

        proxy_pass             http://$upstream/websockify;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade        $http_upgrade;
        proxy_set_header       Connection     "upgrade";
        proxy_set_header       Authorization  $auth_basic;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # auth_request endpoint: not reachable from outside. nginx passes the
    # original URI as a header so Flask can extract the browser_token.
    location = /internal/proxy_auth {
        internal;
        proxy_pass            http://flask/internal/proxy_auth;
        proxy_pass_request_body off;
        proxy_set_header      Content-Length "";
        proxy_set_header      X-Original-URI $request_uri;
        proxy_set_header      Cookie $http_cookie;
    }

    # Reverse-tunnel attach point. Same auth_request shape as /proxy/<token>:
    # nginx pauses the WebSocket upgrade, asks Flask whether this client may
    # attach, and only then proxies to the loopback-bound tunnel server.
    # Verified in a spike: a wrong token yields 401 at the handshake, but the
    # client RETRIES rather than exiting, so the client side must detect that
    # itself -- nginx rejecting the handshake is not itself an exit signal.
    #
    # The prefix must be the URL's first path segment, not a sub-path under
    # some shared "/tunnel/" root: the tunnel server's own per-client
    # restriction matcher only inspects the first path segment (see
    # tunnel_manager.py's module docstring), and the client's real request
    # path is /<prefix>/events -- so the prefix has to be captured here, at
    # the front of the path, rather than re-derived from the end of the URI.
    location ~ ^/(?<tunnel_prefix>tun-[A-Za-z0-9._-]+)(/|$) {
        auth_request           /internal/tunnel_auth;
        proxy_pass             http://127.0.0.1:8080;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade        $http_upgrade;
        proxy_set_header       Connection     "upgrade";
        # Don't forward the client's bearer secret to the tunnel process --
        # it has nothing to do with the WebSocket payload and would
        # otherwise land in the tunnel server's own DEBUG log. Mirrors
        # /proxy/<token> not passing its cookie upstream either.
        proxy_set_header       Authorization  "";
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    location = /internal/tunnel_auth {
        internal;
        proxy_pass            http://flask/internal/tunnel_auth;
        proxy_pass_request_body off;
        proxy_set_header      Content-Length "";
        # Hand the prefix nginx already captured to Flask as its own header,
        # rather than a full URI Flask would have to re-parse -- nginx and
        # Flask must never disagree about which client is attaching.
        proxy_set_header      X-Tunnel-Prefix $tunnel_prefix;
        proxy_set_header      X-Tunnel-Auth   $http_authorization;
    }
}
